name: "Code Review by Gemini AI"
description: "Automatically create code review comments on pull requests using Google Gemini AI"

author: "lupohirp"

inputs:
  gemini_api_key:
    description: "The Gemini AI API token to use for the action"
    required: true
  github_token:
    description: "The GitHub token to use for the action"
    required: true
  github_repository:
    description: "The GitHub repository to use for the action"
    required: true
    default: "${{ github.repository }}"
  github_pull_request_number:
    description: "The GitHub pull request number to use for the action"
    required: true
    default: "${{ github.event.pull_request.number }}"
  git_commit_hash:
    description: "The GitHub commit hash to use for the action"
    required: true
    default: "${{ github.event.pull_request.head.sha }}"
  model:
    description: "Gemini model name"
    required: true
    default: "gemini-flash-latest"
  extra_prompt:
    description: "Extra prompt or system instructions for Gemini"
    required: false
    default: ""
  temperature:
    description: "Temperature for Gemini generation"
    required: false
    default: "0.7"
  max_tokens:
    description: "Max tokens for Gemini generation"
    required: false
    default: "8192"
  top_p:
    description: "Top p for Gemini generation"
    required: false
    default: "0.95"
  frequency_penalty:
    description: "Frequency penalty"
    required: false
    default: "0.0"
  presence_penalty:
    description: "Presence penalty"
    required: false
    default: "0.0"
  pull_request_diff:
    description: "Pull request diff"
    required: true
  pull_request_chunk_size:
    description: "Pull request chunk size in characters"
    required: false
    default: "3500"
  timeout:
    description: "Timeout in seconds per Gemini request"
    required: false
    default: "180"
  log_level:
    description: "Log level"
    required: false
    default: "INFO"

outputs:
  entire_prompt_body:
    description: "Entire prompt body"
    value: ${{ steps.gpt.outputs.entire_prompt_body }}
  review_result:
    description: "Review result"
    value: ${{ steps.gpt.outputs.review_result }}

branding:
  icon: "code"
  color: "blue"

runs:
  using: docker
  image: docker://ghcr.io/lupohirp/gemini-code-review-action:latest
  env:
    GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
    GITHUB_TOKEN: ${{ inputs.github_token }}
    GITHUB_REPOSITORY: ${{ inputs.github_repository }}
    GITHUB_PULL_REQUEST_NUMBER: ${{ inputs.github_pull_request_number }}
    GIT_COMMIT_HASH: ${{ inputs.git_commit_hash }}
  args:
    - "--model=${{ inputs.model }}"
    - "--extra-prompt=${{ inputs.extra_prompt }}"
    - "--temperature=${{ inputs.temperature }}"
    - "--max-tokens=${{ inputs.max_tokens }}"
    - "--top-p=${{ inputs.top_p }}"
    - "--frequency-penalty=${{ inputs.frequency_penalty }}"
    - "--presence-penalty=${{ inputs.presence_penalty }}"
    - "--diff-chunk-size=${{ inputs.pull_request_chunk_size }}"
    - "--timeout=${{ inputs.timeout }}"
    - "--log-level=${{ inputs.log_level }}"
    - "--diff=${{ inputs.pull_request_diff }}"
